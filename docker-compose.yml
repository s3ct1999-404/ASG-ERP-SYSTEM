# LOCAL DEVELOPMENT ONLY. Not a deployment definition (deployment is undecided: assumption A-002).
# Requires a .env file (see .env.example); fails fast if the password is unset.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-asg_erp}
      POSTGRES_USER: ${DB_USER:-asg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # bound to localhost only
    volumes:
      - asg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asg} -d ${DB_NAME:-asg_erp}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  asg_pgdata:
