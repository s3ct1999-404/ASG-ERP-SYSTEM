openapi: 3.0.3
info:
  title: ASG ERP API
  version: 0.1.0
  description: 'Versioned REST API for ASG ERP. Contract-first: see docs/api/openapi.yaml.'
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: Exchange credentials for a bearer token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Revoke the current token
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/branches/:
    get:
      operationId: branches_list
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - branches
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
    post:
      operationId: branches_create
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Branch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Branch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Branch'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/companies/:
    get:
      operationId: companies_list
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - companies
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
          description: ''
    post:
      operationId: companies_create
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Company'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Company'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/v1/health/live/:
    get:
      operationId: health_live_retrieve
      description: 'Liveness: the process is up and serving requests.'
      summary: Liveness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: 'Readiness: the process can reach its database.'
      summary: Readiness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: Who am I and which tenants may I use (system-mode read of the caller's
        own memberships).
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/memberships/:
    get:
      operationId: memberships_list
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - memberships
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
          description: ''
    post:
      operationId: memberships_create
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddMember'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/memberships/{membership_id}/assignments/:
    post:
      operationId: memberships_assignments_create
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Assignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Assignment'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/permissions/:
    get:
      operationId: permissions_retrieve
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - permissions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermCatalog'
          description: ''
  /api/v1/platform/tenants/:
    post:
      operationId: platform_tenants_create
      description: Platform-operator only. Operators get no membership, hence no business-data
        access.
      tags:
      - platform
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTenant'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProvisionTenant'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProvisionTenant'
        required: true
      responses:
        '201':
          description: No response body
  /api/v1/roles/:
    get:
      operationId: roles_list
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - roles
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
          description: ''
    post:
      operationId: roles_create
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      tags:
      - roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Role'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Role'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
components:
  schemas:
    AddMember:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          default: ''
        initial_password:
          type: string
          writeOnly: true
          minLength: 12
      required:
      - email
      - initial_password
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        membership:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          format: uuid
        company:
          type: string
          format: uuid
          nullable: true
        branch:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - membership
      - role
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 20
        is_active:
          type: boolean
      required:
      - code
      - company
      - id
      - name
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        base_currency:
          type: string
          maxLength: 3
        tin:
          type: string
          title: Tax Identification Number
          maxLength: 20
        vat_registered:
          type: boolean
        allow_negative_stock:
          type: boolean
        is_active:
          type: boolean
      required:
      - id
      - name
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - token
    Me:
      type: object
      properties:
        email:
          type: string
          format: email
        tenants:
          type: array
          items: {}
      required:
      - email
      - tenants
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          readOnly: true
        status:
          type: string
          maxLength: 20
      required:
      - email
      - id
    PermCatalog:
      type: object
      properties:
        permissions:
          type: object
          additionalProperties: {}
      required:
      - permissions
    ProvisionTenant:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        owner_email:
          type: string
          format: email
        owner_password:
          type: string
        company_name:
          type: string
      required:
      - company_name
      - name
      - owner_email
      - owner_password
      - slug
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        permissions: {}
        is_system:
          type: boolean
          readOnly: true
      required:
      - id
      - is_system
      - name
    StatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
