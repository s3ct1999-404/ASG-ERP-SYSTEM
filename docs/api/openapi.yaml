        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCode'
          description: ''
  /api/v1/uoms/:
    get:
      operationId: uoms_retrieve
      description: |-
        Read-only list of the tenant's units of measure (RLS scopes rows to the tenant).

        Needed by clients to create products; there is no write endpoint yet (known gap).
      tags:
      - uoms
      responses:
        '200':
          description: No response body
  /api/v1/warehouses/:
    get:
      operationId: warehouses_retrieve
      description: |-
        GET lists rows visible under ``read_perm`` (company scope); POST requires ``write_perm``
        for the target company. Subclasses set model, serializer_class, perms and audit_name.
      tags:
      - warehouses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
    post:
      operationId: warehouses_create
      description: |-
        GET lists rows visible under ``read_perm`` (company scope); POST requires ``write_perm``
        for the target company. Subclasses set model, serializer_class, perms and audit_name.
      tags:
      - warehouses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Warehouse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Warehouse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Warehouse'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
components:
  schemas:
    AddMember:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          default: ''
        initial_password:
          type: string
          writeOnly: true
          minLength: 12
      required:
      - email
      - initial_password
    AdjustIn:
      type: object
      properties:
        warehouse:
          type: string
          format: uuid
        product:
          type: string
          format: uuid
        qty_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        reason:
          type: string
          maxLength: 200
        idempotency_key:
          type: string
          maxLength: 100
      required:
      - idempotency_key
      - product
      - qty_delta
      - reason
      - warehouse
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        membership:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          format: uuid
        company:
          type: string
          format: uuid
          nullable: true
        branch:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - membership
      - role
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 20
        is_active:
          type: boolean
      required:
      - code
      - company
      - id
      - name
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        base_currency:
          type: string
          maxLength: 3
        tin:
          type: string
          title: Tax Identification Number
          maxLength: 20
        vat_registered:
          type: boolean
        allow_negative_stock:
          type: boolean
        is_active:
          type: boolean
      required:
      - id
      - name
    EnvironmentEnum:
      enum:
      - simulated
      - sandbox
      - production
      type: string
      description: |-
        * `simulated` - simulated
        * `sandbox` - sandbox
        * `production` - production
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    InvoiceIn:
      type: object
      properties:
        branch:
          type: string
          format: uuid
        warehouse:
          type: string
          format: uuid
        customer:
          type: string
          format: uuid
          nullable: true
        operation_id:
          type: string
          maxLength: 100
        date:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineIn'
      required:
      - branch
      - lines
      - operation_id
      - warehouse
    JournalIn:
      type: object
      properties:
        company:
          type: string
          format: uuid
        date:
          type: string
          format: date
        memo:
          type: string
          maxLength: 300
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineIn'
      required:
      - company
      - date
      - lines
      - memo
    LineIn:
      type: object
      properties:
        account:
          type: string
          format: uuid
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          default: '0.00'
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
          default: '0.00'
      required:
      - account
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - token
    Me:
      type: object
      properties:
        email:
          type: string
          format: email
        tenants:
          type: array
          items: {}
      required:
      - email
      - tenants
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          readOnly: true
        status:
          type: string
          maxLength: 20
      required:
      - email
      - id
    MethodEnum:
      enum:
      - cash
      - mobile_money
      - card
      - bank_transfer
      type: string
      description: |-
        * `cash` - cash
        * `mobile_money` - mobile_money
        * `card` - card
        * `bank_transfer` - bank_transfer
    Partner:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        kind:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 200
        tin:
          type: string
          maxLength: 20
        nin_or_brn:
          type: string
          maxLength: 30
        phone:
          type: string
          maxLength: 30
        is_active:
          type: boolean
      required:
      - company
      - id
      - kind
      - name
    PaymentIn:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/MethodEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        idempotency_key:
          type: string
          maxLength: 100
      required:
      - amount
      - idempotency_key
      - method
    PeriodIn:
      type: object
      properties:
        company:
          type: string
          format: uuid
        year:
          type: integer
          maximum: 2100
          minimum: 2000
        month:
          type: integer
          maximum: 12
          minimum: 1
        status:
          $ref: '#/components/schemas/PeriodInStatusEnum'
      required:
      - company
      - month
      - status
      - year
    PeriodInStatusEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - open
        * `closed` - closed
    PermCatalog:
      type: object
      properties:
        permissions:
          type: object
          additionalProperties: {}
      required:
      - permissions
    PosSaleIn:
      type: object
      properties:
        branch:
          type: string
          format: uuid
        warehouse:
          type: string
          format: uuid
        operation_id:
          type: string
          maxLength: 100
        date:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineIn'
        tenders:
          type: array
          items:
            $ref: '#/components/schemas/TenderIn'
      required:
      - branch
      - lines
      - operation_id
      - tenders
      - warehouse
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        uom:
          type: string
          format: uuid
        tax_code:
          type: string
          format: uuid
          nullable: true
        sale_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        is_service:
          type: boolean
        is_active:
          type: boolean
      required:
      - company
      - id
      - name
      - sku
      - uom
    ProviderEnum:
      enum:
      - simulator
      - ura_s2s
      type: string
      description: |-
        * `simulator` - simulator
        * `ura_s2s` - ura_s2s
    ProvisionTenant:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        owner_email:
          type: string
          format: email
        owner_password:
          type: string
        company_name:
          type: string
      required:
      - company_name
      - name
      - owner_email
      - owner_password
      - slug
    ReceiptIn:
      type: object
      properties:
        warehouse:
          type: string
          format: uuid
        product:
          type: string
          format: uuid
        qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
        idempotency_key:
          type: string
          maxLength: 100
      required:
      - idempotency_key
      - product
      - qty
      - unit_cost
      - warehouse
    ReverseIn:
      type: object
      properties:
        date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 200
      required:
      - reason
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        permissions: {}
        is_system:
          type: boolean
          readOnly: true
      required:
      - id
      - is_system
      - name
    SettingsIn:
      type: object
      properties:
        company:
          type: string
          format: uuid
        enabled:
          type: boolean
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        environment:
          $ref: '#/components/schemas/EnvironmentEnum'
        offline_window_hours:
          type: integer
          minimum: 1
          nullable: true
      required:
      - company
      - enabled
      - environment
      - provider
    TaxCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,4})?$
        is_exempt:
          type: boolean
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true
        source_note:
          type: string
          maxLength: 300
      required:
      - company
      - effective_from
      - id
      - name
      - rate
    TenderIn:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/MethodEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
      required:
      - amount
      - method
    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
        branch:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
      required:
      - branch
      - code
      - company
      - id
      - name
