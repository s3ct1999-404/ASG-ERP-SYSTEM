openapi: 3.0.3
info:
  title: ASG ERP API
  version: 0.1.0
  description: 'Versioned REST API for ASG ERP. Contract-first: see docs/api/openapi.yaml.'
paths:
  /api/v1/accounting/{company_id}/{report}/:
    get:
      operationId: accounting_retrieve
      description: |-
        Subclasses MUST declare ``permission_map`` (HTTP method -> permission code).

        A method with no entry is denied. Object-level scope checks are the view/service's job via
        ``request.access`` (see ``tenancy.context.AccessContext``).
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: report
        schema:
          type: string
        required: true
      tags:
      - accounting
      responses:
        '200':
          description: No response body
