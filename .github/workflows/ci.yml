name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint, types, migrations, tests, dependency audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asg_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: asg_erp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asg_ci -d asg_erp_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-secret
      DB_NAME: asg_erp_ci
      DB_USER: asg_ci
      DB_PASSWORD: ci-only-not-a-secret
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - name: Lint repo-level scripts and security tests
        working-directory: .
        run: ruff check --config services/api/pyproject.toml scripts tests && ruff format --check --config services/api/pyproject.toml scripts tests
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements/dev.txt --no-deps --disable-pip

  web:
    name: Web (lint, types, tests, build, dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (visibility only; see PROGRESS.md R-008)
        run: npm audit
        continue-on-error: true

  secrets:
    name: Secret scan (tracked files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/check_secrets.py
      - name: Scanner self-test
        run: pip install pytest && python -m pytest tests/security -p no:django -q
